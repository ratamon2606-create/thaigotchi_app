name: thaigotchi
description: "มฤคนที — Cultural Heritage Tamagotchi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  
  # BLE
  flutter_blue_plus: ^1.31.15
  permission_handler: ^11.3.0
  
  # Maps + Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  
  # Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  
  # State + Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  
  # Animation
  flutter_animate: ^4.5.0
  
  http: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/images/searching/
    - assets/data/
  
  fonts:
    - family: ChulabhornLikit
      fonts:
        - asset: assets/fonts/ChulabhornLikitText-Light.otf
          weight: 300
        - asset: assets/fonts/ChulabhornLikitText-Regular.otf
          weight: 400
        - asset: assets/fonts/ChulabhornLikitText-Medium.otf
          weight: 500
        - asset: assets/fonts/ChulabhornLikitText-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"